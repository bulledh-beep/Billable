name: macOS build

# Builds the universal Billable.app (Apple Silicon + Intel), then runs it on
# an Apple Silicon Mac and on a real Intel Mac.
#
# Everything that can run at once does: the two slices build on separate Macs
# while the unit tests and the Intel screen check run alongside, then one job
# joins the slices into the app. Rust's compiled libraries are cached, so only
# Billable's own crates rebuild. Pull requests and pushes use the "ci" profile
# (no fat LTO); tags and Run workflow build exactly what ships ("release").
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What ships is built with the release profile; checks use the quicker ci one.
  PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release' || 'ci' }}

jobs:
  slice:
    name: Build ${{ matrix.arch }} slice
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: ${{ matrix.target }}-${{ env.PROFILE }}

      - name: Build the ${{ matrix.arch }} binary (${{ env.PROFILE }} profile)
        run: |
          BIN="$(scripts/build-slice.sh ${{ matrix.target }} "$PROFILE")"
          mkdir -p "$RUNNER_TEMP/slice/${{ matrix.target }}"
          cp "$BIN" "$RUNNER_TEMP/slice/${{ matrix.target }}/billable"
          lipo -archs "$RUNNER_TEMP/slice/${{ matrix.target }}/billable"

      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.target }}
          path: ${{ runner.temp }}/slice
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Unit tests (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: tests

      - name: Unit tests (Apple Silicon)
        run: cargo test --workspace

  universal:
    name: Universal app (Apple Silicon)
    needs: slice
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/slices

      - name: Build universal app and DMG
        run: BILLABLE_SLICES="$RUNNER_TEMP/slices" scripts/bundle.sh

      - name: Check both architectures are in the app
        run: |
          BIN=release/Billable.app/Contents/MacOS/billable
          lipo -detailed_info "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          for A in arm64 x86_64; do
            echo "== $A"
            vtool -arch "$A" -show-build "$BIN" | grep -E 'platform|minos|sdk'
            vtool -arch "$A" -show-build "$BIN" | grep -q 'minos 12.0'
          done
          codesign --verify --deep --strict --verbose=2 release/Billable.app
          # Without these, WebKit refuses FeedHQ's dictation before macOS can ask.
          plutil -extract NSMicrophoneUsageDescription raw release/Billable.app/Contents/Info.plist
          plutil -extract NSSpeechRecognitionUsageDescription raw release/Billable.app/Contents/Info.plist

      - name: Launch the Apple Silicon slice
        run: scripts/smoke-test.sh release/Billable.app arm64

      - name: Launch the Intel slice under Rosetta
        continue-on-error: true
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          scripts/smoke-test.sh release/Billable.app x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: Billable-universal-dmg
          path: native/release/*.dmg
          if-no-files-found: error

  intel:
    name: Intel Mac (tests and screens)
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Confirm this is an Intel Mac
        run: |
          echo "machine: $(uname -m), macOS $(sw_vers -productVersion)"
          sysctl -n machdep.cpu.brand_string
          test "$(uname -m)" = x86_64
          test "$(sysctl -in hw.optional.arm64 || echo 0)" != 1

      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native
          key: intel

      - name: Unit tests (Intel)
        run: cargo test --workspace

      # Drawing the screens doesn't need the shipping build's fat LTO, so this
      # always uses the ci profile and stays cached.
      - name: Draw every main screen on Intel
        run: |
          cargo build --profile ci -p billable --features snapshots
          export BILLABLE_USER_DATA="$RUNNER_TEMP/snap-data"
          export BILLABLE_SNAPSHOTS="$RUNNER_TEMP/snapshots"
          export BILLABLE_SNAPSHOT_ROUTES="/,/clients,/projects,/time,/billing,/reports,/tax-overview,/settings"
          perl -e 'alarm 600; exec @ARGV' target/ci/billable
          ls -la "$BILLABLE_SNAPSHOTS"
          test "$(ls "$BILLABLE_SNAPSHOTS"/*.png | wc -l)" -eq 8

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Intel-screenshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

  intel-install:
    name: Intel Mac (install the DMG)
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7

      - name: Confirm this is an Intel Mac
        run: |
          echo "machine: $(uname -m), macOS $(sw_vers -productVersion)"
          sysctl -n machdep.cpu.brand_string
          test "$(uname -m)" = x86_64
          test "$(sysctl -in hw.optional.arm64 || echo 0)" != 1

      - uses: actions/download-artifact@v8
        with:
          name: Billable-universal-dmg
          path: dmg

      - name: Install from the DMG, like a person would
        working-directory: .
        run: |
          DMG="$(ls dmg/*.dmg | head -n 1)"
          echo "DMG: $DMG"
          MOUNT="$(hdiutil attach "$DMG" -nobrowse -noverify -noautoopen | grep -oE '/Volumes/.+$' | head -n 1)"
          ls -la "$MOUNT"
          test -L "$MOUNT/Applications"
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$MOUNT/Billable.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$MOUNT"
          lipo -archs "$RUNNER_TEMP/Applications/Billable.app/Contents/MacOS/billable"

      - name: Launch the installed app on Intel
        run: scripts/smoke-test.sh "$RUNNER_TEMP/Applications/Billable.app"

  release:
    name: Publish the release
    # A v* tag, or Run workflow on main (the tag is then made from the version).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [tests, universal, intel, intel-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Billable-universal-dmg
          path: dist
      - name: Work out the tag from the version
        id: version
        run: |
          V=$(sed -n 's/^version *= *"\(.*\)"/\1/p' native/Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "v$V" = "$GITHUB_REF_NAME"; fi
          ls dist/Billable-$V-universal.dmg
          test -f "native/release-notes/v$V.md"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Billable ${{ steps.version.outputs.tag }}
          body_path: native/release-notes/${{ steps.version.outputs.tag }}.md
          files: dist/*.dmg
          fail_on_unmatched_files: true
