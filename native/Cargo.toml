[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
billable-core = { path = "core" }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Day-to-day builds: our code compiles fast, the libraries run fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Shipping builds: as fast and as small as we can make them.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Layout snapping that matches Chromium (see vendor/gpui-pre/BILLABLE_PATCH.md)
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
