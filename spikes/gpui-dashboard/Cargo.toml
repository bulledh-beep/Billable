[package]
name = "billable-gpui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test: Billable's Dashboard drawn natively with GPUI, to compare against the Electron app"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde_json = "1"
anyhow = "1"
allsorts = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
